<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101914">
  <title>Snake — Arcade</title>
  <style>
    :root{color-scheme:dark;--bg:#101914;--panel:#17231c;--line:#2a3a30;--ink:#eff8ef;--muted:#9eb0a0;--green:#a8f078;--lime:#d7ff75;--pink:#ff758b}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0%,#263a2b 0%,var(--bg) 55%);color:var(--ink);font:16px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    .game{width:min(100%,760px)}header{display:flex;justify-content:space-between;align-items:end;gap:16px;margin:0 0 14px}.eyebrow{margin:0;color:var(--green);font-size:.72rem;font-weight:800;letter-spacing:.22em;text-transform:uppercase}h1{margin:2px 0 0;font-size:clamp(2rem,8vw,3rem);line-height:1;letter-spacing:-.06em}.scores{display:flex;gap:10px}.score{min-width:82px;padding:7px 12px;border:1px solid var(--line);border-radius:12px;background:#111b15;text-align:right}.score span{display:block;color:var(--muted);font-size:.65rem;font-weight:800;letter-spacing:.12em}.score strong{font-size:1.2rem;font-variant-numeric:tabular-nums}
    .panel{padding:16px;border:1px solid var(--line);border-radius:14px;background:#111b15;margin-bottom:14px}.panel h2{font-size:1rem;margin:0 0 8px}.panel p{margin:4px 0;color:var(--muted);font-size:.88rem}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.stack{display:grid;gap:10px}.hidden{display:none!important}input{min-width:0;width:min(100%,220px);padding:10px 12px;border:1px solid #405641;border-radius:10px;background:#0d1510;color:var(--ink);font:inherit}button{border:0;border-radius:10px;padding:10px 16px;background:var(--lime);color:#172014;font:inherit;font-weight:850;cursor:pointer;box-shadow:0 4px 0 #83b94d}button:hover{filter:brightness(1.06)}button:active{transform:translateY(2px);box-shadow:0 2px 0 #83b94d}button.secondary{background:#26382b;color:var(--ink);box-shadow:0 4px 0 #18251c;border:1px solid #3a5040}button.danger{background:#ff9eaa;box-shadow:0 4px 0 #b94c5e}button:disabled{opacity:.5;cursor:not-allowed}
    .lobby-top{display:flex;justify-content:space-between;align-items:center;gap:12px}.code{font-size:1.4rem;letter-spacing:.2em;font-weight:900;color:var(--lime);font-variant-numeric:tabular-nums}.players{display:flex;flex-wrap:wrap;gap:7px;padding:0;margin:10px 0 0;list-style:none}.players li{padding:5px 9px;border-radius:999px;background:#203027;border:1px solid #344b39;font-size:.82rem}.gm-tools{display:flex;align-items:end;gap:10px;flex-wrap:wrap;margin-top:12px}.field{display:grid;gap:4px;color:var(--muted);font-size:.8rem}.field input{width:110px}.hint{font-size:.8rem!important}
    .board-wrap{position:relative;overflow:hidden;padding:10px;border:1px solid #405641;border-radius:18px;background:#0d1510;box-shadow:0 24px 70px #0008,inset 0 1px #ffffff12}canvas{display:block;width:100%;aspect-ratio:1;border-radius:10px;touch-action:none}.below{display:flex;justify-content:space-between;align-items:center;gap:14px;margin:14px 2px 0;color:var(--muted);font-size:.85rem}.below strong{color:var(--ink)}.mobile-controls{display:none;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,48px);gap:6px;justify-content:center;margin:18px auto 0;touch-action:none}.mobile-controls button{padding:0;border:1px solid var(--line);background:var(--panel);color:var(--ink);box-shadow:none;font-size:1.2rem}.mobile-controls .up{grid-column:2;grid-row:1}.mobile-controls .left{grid-column:1;grid-row:2}.mobile-controls .down{grid-column:2;grid-row:2}.mobile-controls .right{grid-column:3;grid-row:2}
    @media(max-width:540px){body{padding:14px}.mobile-controls{display:grid}.below{font-size:.76rem}.scores{gap:5px}.score{min-width:68px;padding:6px 8px}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
<main class="game">
  <header><div><p class="eyebrow">Arcade multiplayer</p><h1>Snake</h1></div><div class="scores" aria-label="Scoreboard"><div class="score"><span>YOU</span><strong id="score">00</strong></div><div class="score"><span>BEST</span><strong id="best">00</strong></div></div></header>
  <section class="panel stack" id="lobby-panel">
    <div id="setup">
      <h2>Play together</h2>
      <p>Create a room as game master, or join a friend with their 8-character lobby code. Up to 8 snakes can play.</p>
      <div class="row"><input id="name" maxlength="16" placeholder="Your name" aria-label="Your name"><button id="create">Create lobby</button><span style="color:var(--muted)">or</span><input id="join-code" maxlength="8" placeholder="LOBBY CODE" aria-label="Lobby code"><button class="secondary" id="join">Join lobby</button></div>
      <p class="hint" id="connection-note"></p>
    </div>
    <div id="lobby" class="hidden">
      <div class="lobby-top"><div><p class="eyebrow">Lobby code</p><div class="code" id="room-code"></div></div><div class="row"><button class="secondary" id="copy-code">Copy code</button><button class="secondary" id="leave-lobby">Leave lobby</button></div></div>
      <p id="lobby-status">Waiting for players…</p>
      <ul class="players" id="players"></ul>
      <div class="gm-tools hidden" id="gm-tools">
        <label class="field">Arena size <input id="arena" type="range" min="0" max="8" value="0"><span id="arena-label">Full board</span></label>
        <button class="secondary" id="apply-arena">Set arena</button>
        <button class="danger" id="drop-explosion" disabled>Drop explosion</button>
        <button id="start-round">Start round</button>
      </div>
    </div>
  </section>
  <section class="board-wrap" aria-label="Snake game"><canvas id="board" width="480" height="480" aria-label="Game board"></canvas></section>
  <div class="below"><span>Move with <strong>← ↑ → ↓</strong> or <strong>W A S D</strong></span><span><strong>Space</strong> to pause solo</span></div>
  <div class="mobile-controls" aria-label="Touch controls"><button class="up" data-dir="up" aria-label="Up">↑</button><button class="left" data-dir="left" aria-label="Left">←</button><button class="down" data-dir="down" aria-label="Down">↓</button><button class="right" data-dir="right" aria-label="Right">→</button></div>
  <div class="row" style="justify-content:center;margin-top:16px"><button class="secondary" id="solo">Play solo</button></div>
</main>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(() => {
  const canvas=document.querySelector('#board'),ctx=canvas.getContext('2d'),cells=24,size=canvas.width/cells;
  const scoreEl=document.querySelector('#score'),bestEl=document.querySelector('#best'),setup=document.querySelector('#setup'),lobby=document.querySelector('#lobby');
  const connectionNote=document.querySelector('#connection-note'),statusEl=document.querySelector('#lobby-status'),roomCodeEl=document.querySelector('#room-code'),playersEl=document.querySelector('#players');
  const gmTools=document.querySelector('#gm-tools'),dropButton=document.querySelector('#drop-explosion'),startButton=document.querySelector('#start-round');
  const dirs={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]};
  const palette=['#a8f078','#76d7ff','#ff91be','#ffd166','#bd9cff','#ff936c','#72f1b8','#f4f77d'];
  const bestKey='snake-best';let best=Number(localStorage.getItem(bestKey)||0);bestEl.textContent=String(best).padStart(2,'0');
  const myId=localStorage.getItem('snake-player-id')||crypto.randomUUID();localStorage.setItem('snake-player-id',myId);
  let supabaseClient=null,channel=null,online=false,isHost=false,room='',game=null,timer=null,direction=[1,0],queued=[1,0],soloSnake=[],soloFruit=null,soloScore=0,soloRunning=false;
  const config=window.SNAKE_SUPABASE||{};
  if(config.url&&config.publishableKey&&window.supabase){supabaseClient=window.supabase.createClient(config.url,config.publishableKey);connectionNote.textContent='Realtime is ready. Your lobby code is shared only with people you invite.';}
  else connectionNote.textContent='Multiplayer needs the project URL and publishable key in config.js. Solo play works now.';
  function playerName(){return (document.querySelector('#name').value.trim()||'Player').slice(0,16);}
  function randomCode(){const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let out='';for(let i=0;i<8;i++)out+=chars[Math.floor(Math.random()*chars.length)];return out;}
  function randomSpot(players){let spot,tries=0;do{spot={x:Math.floor(Math.random()*cells),y:Math.floor(Math.random()*cells)};tries++;}while(tries<500&&(players||[]).some(p=>p.snake&&p.snake.some(s=>s.x===spot.x&&s.y===spot.y)));return spot;}
  function freshPlayer(id,name,index){const x=3+(index%4)*5,y=index<4?3:20,dir=index<4?[1,0]:[-1,0];return{id,name,snake:[{x,y},{x-dir[0],y-dir[1]},{x-dir[0]*2,y-dir[1]*2}],dir:dir.slice(),queued:dir.slice(),score:0,alive:true,color:palette[index%palette.length]};}
  function newGame(host){return{hostId:myId,players:[freshPlayer(myId,playerName(),0)],fruit:null,margin:0,explosion:null,running:false,round:0};}
  function showLobby(){setup.classList.add('hidden');lobby.classList.remove('hidden');roomCodeEl.textContent=room;gmTools.classList.toggle('hidden',!isHost);renderPlayers();}
  function renderPlayers(){if(!game)return;playersEl.replaceChildren();game.players.forEach(p=>{const li=document.createElement('li');li.textContent=(p.id===game.hostId?'★ ':'')+p.name+' · '+p.score+(p.alive?'':' · out');li.style.borderColor=p.color;playersEl.append(li);});if(isHost)statusEl.textContent=game.running?'Round in progress':game.players.length+' / 8 players · share the code to invite friends';}
  function send(type,fields){if(!channel||!online)return;channel.send({type:'broadcast',event:'game',payload:Object.assign({type,from:myId},fields||{})});}
  function installChannel(code){if(!supabaseClient)throw Error('Add your Supabase project URL and publishable key to config.js first.');room=code;channel=supabaseClient.channel('snake-room-'+code,{config:{private:false,broadcast:{self:false}}});
    channel.on('broadcast',{event:'game'},({payload})=>onMessage(payload||{}));
    return new Promise((resolve,reject)=>{let settled=false;channel.subscribe(s=>{if(s==='SUBSCRIBED'&&!settled){settled=true;online=true;resolve();}else if((s==='CHANNEL_ERROR'||s==='TIMED_OUT'||s==='CLOSED')&&!settled){settled=true;reject(Error('Could not connect to the lobby. Check the project URL/key and Realtime setting.'));}});});
  }
  function onMessage(m){
    if(!m||m.from===myId)return;
    if(isHost){
      if(m.type==='join-request'){if(!game||game.running){send('join-result',{to:m.from,ok:false,reason:'This round has already started.'});return;}if(game.players.some(p=>p.id===m.from)){send('join-result',{to:m.from,ok:true,state:game});return;}if(game.players.length>=8){send('join-result',{to:m.from,ok:false,reason:'This lobby is full.'});return;}game.players.push(freshPlayer(m.from,String(m.name||'Player').slice(0,16),game.players.length));send('join-result',{to:m.from,ok:true,state:game});broadcastState();renderPlayers();}
      if(m.type==='input'){const p=game&&game.players.find(x=>x.id===m.from&&x.alive);if(p&&validTurn(p.dir,m.dir))p.queued=m.dir;}
      if(m.type==='leave'&&game){game.players=game.players.filter(p=>p.id!==m.from);renderPlayers();broadcastState();}
      return;
    }
    if(m.type==='join-result'&&m.to===myId){if(!m.ok){statusEl.textContent=m.reason||'Could not join.';return;}game=m.state;statusEl.textContent='Connected · '+game.players.length+' / 8 players';renderPlayers();draw();}
    if(m.type==='state'&&m.from===game?.hostId){game=m.state;renderPlayers();draw();if(!game.running&&game.round>0)showMessage(game.players.filter(p=>p.alive).length===1?game.players.find(p=>p.alive)?.name+' wins!':'Round over','The game master can start another round.');}
  }
  function validTurn(old,next){return Array.isArray(next)&&next.length===2&&!(next[0]===-old[0]&&next[1]===-old[1])&&(Math.abs(next[0])+Math.abs(next[1])===1);}
  async function createLobby(){try{if(!supabaseClient)throw Error('Add the Supabase project URL and publishable key to config.js first.');isHost=true;await installChannel(randomCode());game=newGame(true);showLobby();broadcastState();}catch(e){isHost=false;alert(e.message);}}
  async function joinLobby(){const code=document.querySelector('#join-code').value.trim().toUpperCase();if(code.length!==8){alert('Enter the 8-character lobby code.');return;}try{isHost=false;await installChannel(code);showLobby();statusEl.textContent='Requesting a seat…';send('join-request',{name:playerName()});setTimeout(()=>{if(!game)statusEl.textContent='No game master answered. Check the code and try again.';},7000);}catch(e){alert(e.message);if(channel){supabaseClient.removeChannel(channel);channel=null;}online=false;}}
  function broadcastState(){if(!isHost||!game)return;renderPlayers();send('state',{state:game});}
  function startRound(){if(!isHost||!game)return;game.players=game.players.map((p,i)=>freshPlayer(p.id,p.name,i));game.hostId=myId;game.fruit=randomSpot(game.players);game.explosion=null;game.running=true;game.round++;hideMessage();broadcastState();clearInterval(timer);timer=setInterval(hostStep,125);}
  function moveLocal(next){if(online){if(isHost){const p=game.players.find(x=>x.id===myId);if(p&&validTurn(p.dir,next))p.queued=next;}else send('input',{dir:next});return;}if(soloRunning&&validTurn(direction,next))queued=next;}
  function hostStep(){if(!game||!game.running)return;for(const p of game.players){if(!p.alive)continue;p.dir=p.queued.slice();const head={x:p.snake[0].x+p.dir[0],y:p.snake[0].y+p.dir[1]},eating=head.x===game.fruit.x&&head.y===game.fruit.y;const body=eating?p.snake:p.snake.slice(0,-1);
      const wall=head.x<game.margin||head.y<game.margin||head.x>=cells-game.margin||head.y>=cells-game.margin;
      const hitSelf=body.some(s=>s.x===head.x&&s.y===head.y),hitOther=game.players.some(o=>o!==p&&o.alive&&o.snake.some(s=>s.x===head.x&&s.y===head.y));
      if(wall||hitSelf||hitOther){p.alive=false;continue;}p.snake.unshift(head);if(eating){p.score++;game.fruit=randomSpot(game.players);}else p.snake.pop();
    }
    if(game.explosion&&Date.now()>=game.explosion.due){const e=game.explosion;for(const p of game.players){if(!p.alive)continue;const hit=p.snake.findIndex(s=>Math.hypot(s.x-e.x,s.y-e.y)<=e.radius);if(hit>=0){p.snake=p.snake.slice(0,Math.max(1,hit));if(p.snake.length<3)p.alive=false;}}game.explosion=null;}
    const alive=game.players.filter(p=>p.alive);if(alive.length===0||(game.players.length>1&&alive.length===1)){game.running=false;clearInterval(timer);showMessage(alive.length===1?alive[0].name+' wins!':'Round over','The game master can start another round.');}
    broadcastState();draw();
  }
  function applyArena(){if(!isHost||!game)return;game.margin=Number(document.querySelector('#arena').value);document.querySelector('#arena-label').textContent=game.margin===0?'Full board':'Margin '+game.margin+' cells';broadcastState();draw();}
  function dropExplosion(){if(!isHost||!game||!game.running)return;const m=game.margin;game.explosion={x:m+2+Math.floor(Math.random()*Math.max(1,cells-2*m-4)),y:m+2+Math.floor(Math.random()*Math.max(1,cells-2*m-4)),radius:2.2,due:Date.now()+1400};dropButton.disabled=true;setTimeout(()=>{dropButton.disabled=!game?.running;},1700);broadcastState();}
  function draw(){
    ctx.fillStyle='#132019';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.strokeStyle='#ffffff08';ctx.lineWidth=1;
    for(let i=1;i<cells;i++){ctx.beginPath();ctx.moveTo(i*size,0);ctx.lineTo(i*size,canvas.height);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*size);ctx.lineTo(canvas.width,i*size);ctx.stroke();}
    if(online&&game){const m=game.margin;ctx.fillStyle='#04080677';if(m){ctx.fillRect(0,0,canvas.width,m*size);ctx.fillRect(0,(cells-m)*size,canvas.width,m*size);ctx.fillRect(0,m*size,m*size,(cells-2*m)*size);ctx.fillRect((cells-m)*size,m*size,m*size,(cells-2*m)*size);}
      if(game.fruit){ctx.fillStyle='#ff758b';ctx.beginPath();ctx.arc((game.fruit.x+.5)*size,(game.fruit.y+.5)*size,size*.34,0,Math.PI*2);ctx.fill();}
      if(game.explosion){ctx.fillStyle='#ff365977';ctx.beginPath();ctx.arc((game.explosion.x+.5)*size,(game.explosion.y+.5)*size,size*game.explosion.radius,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#ff758b';ctx.lineWidth=2;ctx.stroke();}
      game.players.forEach(p=>{ctx.globalAlpha=p.alive?1:.25;ctx.fillStyle=p.color;p.snake.forEach((part,i)=>{const inset=i===0?2:3;ctx.beginPath();ctx.roundRect(part.x*size+inset,part.y*size+inset,size-inset*2,size-inset*2,5);ctx.fill();});ctx.globalAlpha=1;});
      const mine=game.players.find(p=>p.id===myId);scoreEl.textContent=String(mine?.score||0).padStart(2,'0');dropButton.disabled=!isHost||!game.running;startButton.disabled=!isHost||game.running;return;
    }
    if(soloFruit){ctx.fillStyle='#ff758b';ctx.beginPath();ctx.arc((soloFruit.x+.5)*size,(soloFruit.y+.5)*size,size*.34,0,Math.PI*2);ctx.fill();}
    ctx.fillStyle='#a8f078';soloSnake.forEach((part,index)=>{const inset=index===0?2:3;ctx.beginPath();ctx.roundRect(part.x*size+inset,part.y*size+inset,size-inset*2,size-inset*2,5);ctx.fill();});
    scoreEl.textContent=String(soloScore).padStart(2,'0');
  }
  let msg=null;
  function showMessage(title,body){hideMessage();const el=document.createElement('div');el.id='game-message';el.style.cssText='position:absolute;inset:10px;display:grid;place-items:center;border-radius:10px;background:#07100cc9;text-align:center;padding:20px;font-weight:800;font-size:1.4rem';const card=document.createElement('div'),heading=document.createElement('div'),copy=document.createElement('p');heading.textContent=title;copy.textContent=body;copy.style.cssText='font-size:.9rem;color:#9eb0a0;font-weight:400';card.append(heading,copy);el.append(card);canvas.parentElement.append(el);msg=el;}
  function hideMessage(){if(msg){msg.remove();msg=null;}}
  function soloStart(){if(online)return;clearInterval(timer);soloRunning=true;soloSnake=[{x:11,y:12},{x:10,y:12},{x:9,y:12}];direction=[1,0];queued=[1,0];soloScore=0;soloFruit=randomSpot([{snake:soloSnake}]);hideMessage();document.querySelector('#lobby-panel').classList.add('hidden');timer=setInterval(()=>{direction=queued.slice();const head={x:soloSnake[0].x+direction[0],y:soloSnake[0].y+direction[1]},eat=head.x===soloFruit.x&&head.y===soloFruit.y,body=eat?soloSnake:soloSnake.slice(0,-1);if(head.x<0||head.y<0||head.x>=cells||head.y>=cells||body.some(s=>s.x===head.x&&s.y===head.y)){soloRunning=false;clearInterval(timer);showMessage('Game over','You scored '+soloScore+'. Press Play solo for another round.');return;}soloSnake.unshift(head);if(eat){soloScore++;if(soloScore>best){best=soloScore;bestEl.textContent=String(best).padStart(2,'0');localStorage.setItem(bestKey,String(best));}soloFruit=randomSpot([{snake:soloSnake}]);}else soloSnake.pop();draw();},Math.max(72,145-soloScore*2));draw();}
  function endOnline(){if(channel){send('leave');supabaseClient.removeChannel(channel);}channel=null;online=false;isHost=false;game=null;clearInterval(timer);setup.classList.remove('hidden');lobby.classList.add('hidden');document.querySelector('#lobby-panel').classList.remove('hidden');draw();}
  document.querySelector('#create').addEventListener('click',createLobby);document.querySelector('#join').addEventListener('click',joinLobby);document.querySelector('#start-round').addEventListener('click',startRound);document.querySelector('#apply-arena').addEventListener('click',applyArena);document.querySelector('#drop-explosion').addEventListener('click',dropExplosion);document.querySelector('#solo').addEventListener('click',soloStart);
  document.querySelector('#arena').addEventListener('input',e=>{document.querySelector('#arena-label').textContent=Number(e.target.value)===0?'Full board':'Margin '+e.target.value+' cells';});
  document.querySelector('#copy-code').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(room);statusEl.textContent='Lobby code copied: '+room;}catch(_){statusEl.textContent='Share this code: '+room;}});
  window.addEventListener('keydown',e=>{if(dirs[e.key]){e.preventDefault();moveLocal(dirs[e.key]);}else if(e.code==='Space'&&!online&&soloRunning){e.preventDefault();soloRunning=false;clearInterval(timer);showMessage('Paused','Press Play solo to resume a new run.');}});
  document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('click',()=>moveLocal(({up:dirs.ArrowUp,down:dirs.ArrowDown,left:dirs.ArrowLeft,right:dirs.ArrowRight})[b.dataset.dir])));
  let touch=null;canvas.addEventListener('touchstart',e=>{touch={x:e.changedTouches[0].clientX,y:e.changedTouches[0].clientY};},{passive:true});canvas.addEventListener('touchend',e=>{if(!touch)return;const dx=e.changedTouches[0].clientX-touch.x,dy=e.changedTouches[0].clientY-touch.y;if(Math.max(Math.abs(dx),Math.abs(dy))>20)moveLocal(Math.abs(dx)>Math.abs(dy)?(dx>0?[1,0]:[-1,0]):(dy>0?[0,1]:[0,-1]));touch=null;},{passive:true});
  document.querySelector('#leave-lobby').addEventListener('click',endOnline);
  window.addEventListener('beforeunload',()=>{if(online)send('leave');});
  soloSnake=[{x:11,y:12},{x:10,y:12},{x:9,y:12}];soloFruit=randomSpot([{snake:soloSnake}]);draw();
})();
</script>
</body>
</html>
