<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101914">
  <title>Snake — Arcade</title>
  <style>
    :root { color-scheme: dark; --bg:#101914; --panel:#17231c; --line:#2a3a30; --ink:#eff8ef; --muted:#9eb0a0; --green:#a8f078; --lime:#d7ff75; --pink:#ff758b; }
    * { box-sizing:border-box }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:radial-gradient(ellipse at 50% 0%,#263a2b 0%,var(--bg) 55%); color:var(--ink); font:16px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif }
    .game { width:min(100%,620px) }
    header { display:flex; justify-content:space-between; align-items:end; gap:16px; margin:0 0 14px }
    .eyebrow { margin:0; color:var(--green); font-size:.72rem; font-weight:800; letter-spacing:.22em; text-transform:uppercase }
    h1 { margin:2px 0 0; font-size:clamp(2rem,8vw,3rem); line-height:1; letter-spacing:-.06em }
    .scores { display:flex; gap:10px }
    .score { min-width:82px; padding:7px 12px; border:1px solid var(--line); border-radius:12px; background:#111b15; text-align:right }
    .score span { display:block; color:var(--muted); font-size:.65rem; font-weight:800; letter-spacing:.12em }
    .score strong { font-size:1.2rem; font-variant-numeric:tabular-nums }
    .board-wrap { position:relative; overflow:hidden; padding:10px; border:1px solid #405641; border-radius:18px; background:#0d1510; box-shadow:0 24px 70px #0008, inset 0 1px #ffffff12 }
    canvas { display:block; width:100%; aspect-ratio:1; border-radius:10px; touch-action:none }
    .overlay { position:absolute; inset:10px; display:grid; place-items:center; border-radius:10px; background:#07100cc9; text-align:center; transition:opacity .18s }
    .overlay.hidden { opacity:0; pointer-events:none }
    .card { max-width:80%; padding:22px }
    .card h2 { margin:0 0 6px; font-size:clamp(1.5rem,6vw,2.2rem); letter-spacing:-.04em }
    .card p { margin:0 0 18px; color:var(--muted) }
    button { border:0; border-radius:11px; padding:11px 20px; background:var(--lime); color:#172014; font:inherit; font-weight:900; cursor:pointer; box-shadow:0 5px 0 #83b94d; transition:transform .12s,box-shadow .12s }
    button:hover { transform:translateY(-1px); box-shadow:0 6px 0 #83b94d }
    button:active { transform:translateY(3px); box-shadow:0 2px 0 #83b94d }
    .below { display:flex; justify-content:space-between; align-items:center; gap:14px; margin:14px 2px 0; color:var(--muted); font-size:.85rem }
    .below strong { color:var(--ink) }
    .mobile-controls { display:none; grid-template-columns:repeat(3,58px); grid-template-rows:repeat(2,48px); gap:6px; justify-content:center; margin:18px auto 0; touch-action:none }
    .mobile-controls button { padding:0; border:1px solid var(--line); background:var(--panel); color:var(--ink); box-shadow:none; font-size:1.2rem }
    .mobile-controls button:active { background:#2c4230; transform:scale(.96) }
    .mobile-controls .up { grid-column:2; grid-row:1 }
    .mobile-controls .left { grid-column:1; grid-row:2 }
    .mobile-controls .down { grid-column:2; grid-row:2 }
    .mobile-controls .right { grid-column:3; grid-row:2 }
    @media (max-width:520px) { body { padding:16px } .mobile-controls { display:grid } .below { font-size:.78rem } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { transition:none!important } }
  </style>
</head>
<body>
  <main class="game">
    <header>
      <div><p class="eyebrow">Classic arcade</p><h1>Snake</h1></div>
      <div class="scores" aria-label="Scoreboard">
        <div class="score"><span>SCORE</span><strong id="score">00</strong></div>
        <div class="score"><span>BEST</span><strong id="best">00</strong></div>
      </div>
    </header>
    <section class="board-wrap" aria-label="Snake game">
      <canvas id="board" width="480" height="480" aria-label="Game board"></canvas>
      <div class="overlay" id="overlay">
        <div class="card"><h2 id="message">Ready to play?</h2><p id="hint">Eat the fruit. Don’t hit the walls or yourself.</p><button id="start">Start game</button></div>
      </div>
    </section>
    <div class="below"><span>Move with <strong>← ↑ → ↓</strong> or <strong>W A S D</strong></span><span><strong>Space</strong> to pause</span></div>
    <div class="mobile-controls" aria-label="Touch controls">
      <button class="up" data-dir="up" aria-label="Up">↑</button><button class="left" data-dir="left" aria-label="Left">←</button><button class="down" data-dir="down" aria-label="Down">↓</button><button class="right" data-dir="right" aria-label="Right">→</button>
    </div>
  </main>
  <script>
    (() => {
      const canvas = document.querySelector('#board');
      const ctx = canvas.getContext('2d');
      const scoreEl = document.querySelector('#score');
      const bestEl = document.querySelector('#best');
      const overlay = document.querySelector('#overlay');
      const message = document.querySelector('#message');
      const hint = document.querySelector('#hint');
      const startButton = document.querySelector('#start');
      const cells = 24;
      const size = canvas.width / cells;
      const directions = { ArrowUp:[0,-1], w:[0,-1], ArrowDown:[0,1], s:[0,1], ArrowLeft:[-1,0], a:[-1,0], ArrowRight:[1,0], d:[1,0] };
      let snake, direction, queued, fruit, score, timer, running = false;
      let best = Number(localStorage.getItem('snake-best') || 0);
      bestEl.textContent = String(best).padStart(2,'0');
      function randomFruit() {
        let spot;
        do { spot = { x:Math.floor(Math.random()*cells), y:Math.floor(Math.random()*cells) }; }
        while (snake.some(part => part.x === spot.x && part.y === spot.y));
        return spot;
      }
      function reset() {
        snake = [{x:11,y:12},{x:10,y:12},{x:9,y:12}]; direction = [1,0]; queued = [1,0];
        score = 0; scoreEl.textContent = '00'; fruit = randomFruit(); draw();
      }
      function draw() {
        ctx.fillStyle = '#132019'; ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.strokeStyle = '#ffffff08'; ctx.lineWidth = 1;
        for (let i=1;i<cells;i++) { ctx.beginPath(); ctx.moveTo(i*size,0); ctx.lineTo(i*size,canvas.height); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0,i*size); ctx.lineTo(canvas.width,i*size); ctx.stroke(); }
        ctx.fillStyle = '#ff758b'; ctx.beginPath(); ctx.arc((fruit.x+.5)*size,(fruit.y+.5)*size,size*.34,0,Math.PI*2); ctx.fill();
        ctx.fillStyle = '#a8f078'; snake.forEach((part,index) => { const inset = index===0 ? 2 : 3; ctx.beginPath(); ctx.roundRect(part.x*size+inset,part.y*size+inset,size-inset*2,size-inset*2,5); ctx.fill(); });
        const head=snake[0]; ctx.fillStyle='#173019'; const eyeX=direction[0]===0?size*.35:(direction[0]>0?size*.68:size*.32); const eyeY=direction[1]===0?size*.35:(direction[1]>0?size*.68:size*.32);
        ctx.beginPath(); ctx.arc(head.x*size+eyeX,head.y*size+eyeY,2.2,0,Math.PI*2); ctx.fill();
      }
      function step() {
        direction = queued;
        const head = {x:snake[0].x+direction[0], y:snake[0].y+direction[1]};
        const eating = head.x===fruit.x && head.y===fruit.y;
        const body = eating ? snake : snake.slice(0,-1);
        if (head.x<0 || head.y<0 || head.x>=cells || head.y>=cells || body.some(part=>part.x===head.x && part.y===head.y)) return endGame();
        snake.unshift(head);
        if (eating) { score++; scoreEl.textContent=String(score).padStart(2,'0'); if(score>best){ best=score; bestEl.textContent=String(best).padStart(2,'0'); localStorage.setItem('snake-best',best); } fruit=randomFruit(); }
        else snake.pop();
        draw();
      }
      function start() { clearInterval(timer); reset(); running=true; overlay.classList.add('hidden'); timer=setInterval(step,Math.max(72,145-score*2)); }
      function endGame() { running=false; clearInterval(timer); message.textContent='Game over'; hint.textContent=`You scored ${score}. Ready for another round?`; startButton.textContent='Play again'; overlay.classList.remove('hidden'); }
      function pause() { if(!running)return; running=false; clearInterval(timer); message.textContent='Paused'; hint.textContent='Take a breath. Your run is waiting.'; startButton.textContent='Resume'; overlay.classList.remove('hidden'); }
      function setDirection(next) { if(!running)return; if(next[0]===-direction[0] && next[1]===-direction[1])return; queued=next; }
      window.addEventListener('keydown',event=>{ if(directions[event.key]){event.preventDefault();setDirection(directions[event.key]);} else if(event.code==='Space'){event.preventDefault();if(running)pause();} });
      startButton.addEventListener('click',start);
      document.querySelectorAll('[data-dir]').forEach(button=>button.addEventListener('click',()=>{const key={up:'ArrowUp',down:'ArrowDown',left:'ArrowLeft',right:'ArrowRight'}[button.dataset.dir];setDirection(directions[key]);}));
      let touchStart=null;
      canvas.addEventListener('touchstart',event=>{touchStart={x:event.changedTouches[0].clientX,y:event.changedTouches[0].clientY};},{passive:true});
      canvas.addEventListener('touchend',event=>{if(!touchStart)return;const dx=event.changedTouches[0].clientX-touchStart.x,dy=event.changedTouches[0].clientY-touchStart.y;if(Math.max(Math.abs(dx),Math.abs(dy))>20)setDirection(Math.abs(dx)>Math.abs(dy)?(dx>0?[1,0]:[-1,0]):(dy>0?[0,1]:[0,-1]));touchStart=null;},{passive:true});
      reset();
    })();
  </script>
</body>
</html>
